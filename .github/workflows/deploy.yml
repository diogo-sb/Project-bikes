Sim. 👍

Nesse momento, você terá dois workflows separados:

.github/
└── workflows/
    ├── ci.yml
    └── deploy.yml

O ci.yml já cuida da validação.

Agora crie o deploy.yml. Inicialmente, ele pode ser praticamente igual ao ci.yml, mudando apenas:

O nome do workflow.
O gatilho (on).
Adicionando o bundle deploy.

Pode usar este conteúdo:

name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Bundle
        run: databricks bundle validate

      - name: Deploy Bundle
        run: databricks bundle deploy

      - name: Verificar autenticação
        run: databricks current-user me